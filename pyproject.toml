[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-distillation"
version = "0.1.0"
description = "Compile repeated LLM decisions into cheap CPU models, with a risk-controlled gate that decides when each may answer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
sbert = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
gdistill = "guarded_distillation.cli:main"
cortisol = "guarded_distillation.cli:main"   # old command name

[tool.setuptools]
packages = ["guarded_distillation"]

[tool.setuptools.package-data]
guarded_distillation = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
