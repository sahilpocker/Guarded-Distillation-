# Render Blueprint: New > Blueprint > pick this repo. Free web service built from the Dockerfile.
services:
  - type: web
    name: guarded-distillation-triage
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DAILY_CAP_USD
        value: "1.0"
      - key: ANTHROPIC_API_KEY
        sync: false          # paste in the Render dashboard; without it the service answers from the label cache only
      - key: MODEL_REGISTRY
        value: sahilpocker/Guarded-Distillation-   # releases tagged model-vN hold the bundles the service promotes
      - key: REGISTRY_POLL_S
        value: "600"
      - key: DATABASE_URL
        sync: false          # a free Postgres (Neon or Supabase) connection string; keeps the log, spend and model version across restarts
      - key: ADMIN_TOKEN
        generateValue: true  # protects /admin/export and /admin/reload
