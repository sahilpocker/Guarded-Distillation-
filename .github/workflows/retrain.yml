name: retrain
on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the model-vN release when the gate passes"
        type: boolean
        default: true

permissions:
  contents: write

env:
  SERVICE_URL: ${{ vars.SERVICE_URL || 'https://guarded-distillation-triage.onrender.com' }}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install (ONNX encoder, no torch)
        run: |
          pip install -r requirements-serve.txt
          pip install --no-deps -e .
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/raw
          key: models-data-${{ hashFiles('guarded_distillation/data.py') }}-onnx
      - name: Download datasets (pinned SHA-256)
        run: gdistill data
      - name: Wake the service, then retrain, gate and publish
        env:
          GD_EMBED: onnx
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.SERVICE_ADMIN_TOKEN }}     # optional: without it the candidate trains on the history only
        run: |
          curl -sS --retry 6 --retry-delay 15 --retry-all-errors -m 90 "$SERVICE_URL/healthz" > /dev/null || true
          publish=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then publish="--publish"; fi
          gdistill retrain --export-url "$SERVICE_URL" --repo "${{ github.repository }}" $publish

      - name: Point the image at the newest model (changing models/LATEST makes Render rebuild with it baked in)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 20 --json tagName -q '[.[] | select(.tagName | test("^model-v[0-9]+$"))] | sort_by(.tagName | ltrimstr("model-v") | tonumber) | last | .tagName')
          if [ -n "$tag" ] && [ "$tag" != "$(cat models/LATEST 2>/dev/null)" ]; then
            echo "$tag" > models/LATEST
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models/LATEST
            git commit -m "Image: bake $tag"
            git push
          fi
