name: retrain
on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the model-vN release when the gate passes"
        type: boolean
        default: true

permissions:
  contents: write

env:
  SERVICE_URL: ${{ vars.SERVICE_URL || 'https://guarded-distillation-triage.onrender.com' }}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install (ONNX encoder, no torch)
        run: |
          pip install -r requirements-serve.txt
          pip install --no-deps -e .
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/raw
          key: models-data-${{ hashFiles('guarded_distillation/data.py') }}-onnx
      - name: Download datasets (pinned SHA-256)
        run: gdistill data
      - name: Wake the service, then retrain, gate and publish
        env:
          GD_EMBED: onnx
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.SERVICE_ADMIN_TOKEN }}     # optional: without it the candidate trains on the history only
        run: |
          curl -sS --retry 6 --retry-delay 15 --retry-all-errors -m 90 "$SERVICE_URL/healthz" > /dev/null || true
          publish=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then publish="--publish"; fi
          gdistill retrain --export-url "$SERVICE_URL" --repo "${{ github.repository }}" $publish
