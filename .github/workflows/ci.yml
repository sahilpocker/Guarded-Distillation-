name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch keeps the image small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,sbert]"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/raw
          key: models-data-${{ hashFiles('guarded_distillation/data.py') }}-minilm
      - name: Unit tests
        run: python -m pytest -q
      - name: Download datasets (pinned SHA-256)
        run: gdistill data
      - name: Eval replay from cached Haiku labels (no API calls)
        run: gdistill eval
